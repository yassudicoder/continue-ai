<!doctype html>
<!-- Source for og/cover.png — open at exactly 1200×630 and screenshot.
     Night-freight theme: the extension's dark canvas + blue→violet transfer gradient. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 100 900; font-stretch: 62% 125%;
    src: url('../fonts/archivo-100-900.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500;
    src: url('../fonts/ibm-plex-mono-500.woff2') format('woff2'); }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #0a0a0a; color: #f5f5f5;
    font-family: 'Archivo', sans-serif; overflow: hidden; position: relative; padding: 64px 72px; }
  body::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(900px 420px at 82% 110%, rgba(139,92,246,.14), transparent 65%),
                radial-gradient(900px 420px at 12% -10%, rgba(59,130,246,.12), transparent 65%); }
  .doc { font: 500 15px 'IBM Plex Mono', monospace; letter-spacing: .14em; color: #8a8a8a; }
  h1 { font-size: 92px; line-height: .98; font-weight: 900; letter-spacing: -.02em;
    text-transform: uppercase; margin-top: 46px; white-space: nowrap; position: relative; z-index: 1; }
  h1 .o { background: linear-gradient(94deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .route { position: absolute; left: 72px; right: 72px; bottom: 150px; display: flex; align-items: center; gap: 18px;
    font: 500 17px 'IBM Plex Mono', monospace; letter-spacing: .1em; color: #a3a3a3; z-index: 1; }
  .route .line { flex: 1; border: 0; border-top: 3px dashed transparent; position: relative; height: 0;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6) left center / 100% 3px no-repeat;
    -webkit-mask: repeating-linear-gradient(90deg, #000 0 14px, transparent 14px 24px); mask: repeating-linear-gradient(90deg, #000 0 14px, transparent 14px 24px); }
  .cap { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: linear-gradient(90deg, #3b82f6, #8b5cf6); color: #06070d;
    font: 500 15px 'IBM Plex Mono', monospace; letter-spacing: .14em; font-weight: 500;
    padding: 12px 20px; border-radius: 999px;
    box-shadow: 0 8px 34px rgba(59,130,246,.4), 0 4px 22px rgba(139,92,246,.35); }
  .route .cap { -webkit-mask: none; mask: none; }
  .capwrap { position: absolute; left: 50%; top: 50%; }
  .facts { position: absolute; left: 72px; right: 72px; bottom: 64px;
    font: 500 15px 'IBM Plex Mono', monospace; letter-spacing: .14em; color: #8a8a8a;
    border-top: 1px solid rgba(255,255,255,.14); padding-top: 22px; display: flex; justify-content: space-between; z-index: 1; }
  .brand { position: absolute; top: 58px; right: 72px; display: flex; align-items: center; gap: 12px;
    font: 800 20px 'Archivo'; letter-spacing: .12em; z-index: 1; }
  .brand b { color: #60a5fa; }
  .brand img { border-radius: 8px; display: block; }
</style>
</head>
<body>
  <p class="doc"><span>CONTINUE AI — FREE CHROME EXTENSION</span></p>
  <div class="brand"><img src="../icon.png" width="34" height="34" alt="">CONTINUE<b>AI</b></div>
  <h1>Switch the model.<br><span class="o">Keep the thread.</span></h1>
  <div class="route">
    <span style="color:#60a5fa">◦ CHATGPT</span>
    <span class="line"></span>
    <span class="cap" style="position:relative;left:auto;top:auto;transform:none">CTX-CAPSULE ▸</span>
    <span class="line" style="background:linear-gradient(90deg,#8b5cf6,#a78bfa) left center / 100% 3px no-repeat"></span>
    <span style="color:#a78bfa">● CLAUDE · GEMINI · +5</span>
  </div>
  <p class="facts"><span>LOCAL-FIRST · NO ACCOUNT · NO TELEMETRY</span><span>ONE CLICK · EIGHT DESTINATIONS</span></p>
</body>
</html>
